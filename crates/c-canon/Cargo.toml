[package]
name = "c-canon"
version = "0.1.0"
description = "C source → structural canonicalization + file-scope definition scan (tree-sitter parser). The C frontend for find-dup-defs."
keywords = ["c", "ast", "canonicalize", "clone"]
categories = ["parser-implementations", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "c_canon"

[dependencies]
# The frontend↔engine contract (Def / KindSpec / Analysis / Frontend / LineMap) this crate implements.
dup-defs-core = { path = "../dup-defs-core", features = ["tree-sitter"], version = "0.4.2" }
# tree-sitter: an error-recovering incremental parser; one bad declaration costs that declaration,
# not the file. The C grammar is the tree-sitter project's own.
tree-sitter = "0.27"
tree-sitter-c = "0.24"
rayon = "1"

[lints]
workspace = true
