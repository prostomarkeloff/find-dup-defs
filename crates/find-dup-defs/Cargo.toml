[package]
name = "find-dup-defs"
version = "0.9.0"
description = "Find duplicate / near-duplicate top-level definitions across a codebase via clone clustering — Python, Rust, and TypeScript frontends, plus an opt-in structural helper-extraction pass."
keywords = ["duplicate", "clone", "refactor", "lint", "ast"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "find-dup-defs"
path = "src/main.rs"

[dependencies]
# The frontend↔engine contract (Def / KindSpec / Frontend) the engine clusters over.
dup-defs-core = { path = "../dup-defs-core", version = "0.2" }
py-canon = { path = "../py-canon", version = "0.4" }
# TypeScript frontend — same contract as `py-canon`, oxc-based parser. `0.1.4` carries the
# arrow-const name blanking the TS patternology dialect relies on, so pin the floor there.
ts-canon = { path = "../ts-canon", version = "0.2" }
# Rust frontend — same contract as `py-canon`/`ts-canon`, over the `syn` parser.
rs-canon = { path = "../rs-canon", version = "0.2" }
# exact difflib Ratcliff–Obershelp ratio + clustering + exact weighted-cosine similarity join
# (simjoin) — https://crates.io/crates/difflib-fast
difflib-fast = "0.3.5"
# The directive mini-language (ACTION:[<KIND>]NAME[@PATH][=NOTE]) — parsing, glob matching, the
# `-D` overload, and the lint pack (LintAction/Severity/fold) — https://crates.io/crates/directiva
directiva = "0.1"
rayon = "1"
rustc-hash = "2" # FxHash for the Type-3 (ECScan) pass's hot token/shingle maps
walkdir = "2"
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
# JSON report. preserve_order → object keys keep insertion order (matches the Python reference's
# dict order); serde's struct-field order + ryu floats reproduce its output byte-for-byte.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# Heterogeneous CPU+GPU name-gated clustering through difflib-fast's Metal backend (Apple Silicon
# only; a no-op elsewhere — the Rationer degrades to CPU with identical output). Off by default so
# the stock build links no Metal/CoreFoundation; opt in at build time (`cargo build --features gpu`)
# and then engage at runtime with `-D 'settings:gpu=on'`.
gpu = ["difflib-fast/gpu"]

[lints]
workspace = true
