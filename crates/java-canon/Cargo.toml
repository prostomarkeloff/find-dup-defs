[package]
name = "java-canon"
version = "0.1.1"
description = "Java source → structural canonicalization + definition scan (tree-sitter parser). The Java frontend for find-dup-defs."
keywords = ["java", "ast", "canonicalize", "clone"]
categories = ["parser-implementations", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "java_canon"

[dependencies]
# The frontend↔engine contract (Def / KindSpec / Analysis / Frontend / LineMap) this crate implements.
dup-defs-core = { path = "../dup-defs-core", features = ["tree-sitter"], version = "0.4.6" }
# tree-sitter: an error-recovering incremental parser; one bad declaration costs that declaration,
# not the file. The Java grammar is the tree-sitter project's own.
tree-sitter = "0.27"
tree-sitter-java = "0.23"
rayon = "1"

[lints]
workspace = true
