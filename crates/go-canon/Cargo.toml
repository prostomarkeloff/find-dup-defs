[package]
name = "go-canon"
version = "0.1.1"
description = "Go source → structural canonicalization + package-level definition scan (tree-sitter parser). The Go frontend for find-dup-defs."
keywords = ["go", "golang", "ast", "canonicalize", "clone"]
categories = ["parser-implementations", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "go_canon"

[dependencies]
# The frontend↔engine contract (Def / KindSpec / Analysis / Frontend / LineMap) this crate implements.
dup-defs-core = { path = "../dup-defs-core", features = ["tree-sitter"], version = "0.4.2" }
# tree-sitter: an error-recovering incremental parser; one bad declaration costs that declaration,
# not the file. The Go grammar is the tree-sitter project's own.
tree-sitter = "0.27"
tree-sitter-go = "0.25"
rayon = "1"

[lints]
workspace = true
