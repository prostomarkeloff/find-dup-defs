# Build PyPI wheels (one per platform) + the sdist, and expose them as a single downloadable
# artifact. Publishing is manual and off-CI: grab the artifact and run `uv publish` yourself.
#
#   gh run download <run-id> -n find-dup-defs-dist -D dist
#   uv publish dist/*
#
# Runs on version tags (same `v*` scheme as CI.yml's binary release) and on demand.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.target }}${{ matrix.manylinux && format(' / {0}', matrix.manylinux) || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc (manylinux) + musl (musllinux), x86_64 and aarch64. aarch64 builds natively
          # on the arm runner — no QEMU. `manylinux: auto` picks maturin's default glibc baseline.
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   manylinux: auto }
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          # macOS arm64 (native) + Intel (cross-compiled on the arm runner, as CI.yml does).
          - { runner: macos-latest,     target: aarch64-apple-darwin }
          - { runner: macos-latest,     target: x86_64-apple-darwin }
          # Windows x86_64 (MSVC, native).
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `manylinux` is ignored on macOS/Windows; on Linux it selects the build container.
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}${{ matrix.manylinux && format('-{0}', matrix.manylinux) || '' }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  merge:
    name: merge into one artifact
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    steps:
      # Fold every per-target artifact into a single `find-dup-defs-dist` holding a flat dist/ of
      # all wheels + the sdist — one download, ready for `uv publish dist/*`.
      - uses: actions/upload-artifact/merge@v4
        with:
          name: find-dup-defs-dist
          pattern: dist-*
          delete-merged: true
